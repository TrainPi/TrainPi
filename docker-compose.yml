version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/trainpi
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SECRET_KEY=supersecretkey
    depends_on:
      - db
    networks:
      - trainpi-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trainpi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trainpi-network

networks:
  trainpi-network:
    driver: bridge

volumes:
  postgres_data:
